# =========================================================================
# PRODUCTION PROFILE PROPERTIES (application-prod.properties)
# =========================================================================
# Intended for high availability, security, scalability, and performance.

# Server Port
server.port=${SERVER_PORT:8085}

# Graceful Shutdown
# Allow active requests to finish processing during shutdown (up to 30s timeout by default)
server.shutdown=graceful

# -------------------------------------------------------------------------
# DATABASE CONFIGURATION
# -------------------------------------------------------------------------
# Production credentials must be provided as environment variables
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:edkart}?useSSL=${DB_USE_SSL:false}&requireSSL=${DB_REQUIRE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY:true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configurations
# Validate only: Ensure existing schema matches entities without modifying database tables
spring.jpa.hibernate.ddl-auto=validate
# Disable direct SQL printing to standard output to preserve memory and disk space
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Batch Write Optimizations
# Bundles multiple SQL operations together for better network throughput
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# -------------------------------------------------------------------------
# CONNECTION POOL TUNING (HikariCP)
# -------------------------------------------------------------------------
# Maximizes db throughput and prevents resource exhaustion
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.pool-name=EdKartHikariCP

# -------------------------------------------------------------------------
# EMBEDDED TOMCAT OPTIMIZATIONS
# -------------------------------------------------------------------------
# Maximizes simultaneous request handling and tunes Keep-Alive parameters
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:20}
server.tomcat.max-connections=${TOMCAT_MAX_CONN:8192}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.keep-alive-timeout=${TOMCAT_KEEP_ALIVE_TIMEOUT:60000}
server.tomcat.max-keep-alive-requests=${TOMCAT_MAX_KEEP_ALIVE:100}

# -------------------------------------------------------------------------
# HTTP RESPONSE COMPRESSION (Gzip)
# -------------------------------------------------------------------------
# Compresses responses to save egress bandwidth and decrease page load latency
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=2048

# -------------------------------------------------------------------------
# JACKSON SERIALIZATION CONFIGURATION
# -------------------------------------------------------------------------
# Serializes dates in ISO-8601 strings and sets timezone consistently
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=${APP_TIMEZONE:UTC}
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX

# -------------------------------------------------------------------------
# SECURITY CONFIGURATION (CORS & JWT)
# -------------------------------------------------------------------------
# Domain allowed to make API calls to this backend
edkart.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Secret configuration placeholders (for future JWT implementation)
edkart.jwt.secret=${JWT_SECRET}
edkart.jwt.expiration=${JWT_EXPIRATION:86400000}

# -------------------------------------------------------------------------
# AWS & CLOUDINARY CONFIGURATION (Dynamic values)
# -------------------------------------------------------------------------
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# -------------------------------------------------------------------------
# MAIL CONFIGURATION (SMTP Server)
# -------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -------------------------------------------------------------------------
# ACTUATOR & MONITORING CONFIGURATION
# -------------------------------------------------------------------------
# Exposes clean JSON endpoint to monitor microservice health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.metrics.export.defaults.enabled=true
