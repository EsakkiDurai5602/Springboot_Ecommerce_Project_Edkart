# =========================================================================
# DEVELOPMENT PROFILE PROPERTIES (application-dev.properties)
# =========================================================================
# Intended for local developer run and quick iterations.

# Port on which the local server runs
server.port=${SERVER_PORT:8085}

# Database Connection Settings
# Configured for standard local MySQL database instance
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:edkart}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Durai5602.$}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
# Auto-update SQL schema matches entities during local runs
spring.jpa.hibernate.ddl-auto=update
# Print queries to console for debugging purposes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Developer Utilities
# Enables hot-swapping and auto-restart of spring app on code change
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Log Levels (More verbose logging for development)
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
