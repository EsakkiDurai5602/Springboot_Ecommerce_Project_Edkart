# =========================================================================
# COMMON APPLICATION PROPERTIES
# =========================================================================
# These configurations are common across all environments (Dev, Prod, Test).
# Active profile can be selected via the SPRING_PROFILES_ACTIVE env variable.

# Application Name
spring.application.name=edkart

# Environment profile selection (defaulting to local development profile 'dev')
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Static resource locations (uploads directory for product images)
# Resolves to a dynamic path or defaults to the local 'uploads/' folder
spring.web.resources.static-locations=file:${UPLOADS_DIR:uploads/}