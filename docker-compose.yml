services:
  # MySQL Database Container
  mysql:
    image: mysql:8.0
    container_name: edkart-mysql
    restart: always
    environment:
      MYSQL_DATABASE: edkart_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: edkart_user
      MYSQL_PASSWORD: edkart_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - edkart-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edkart-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/edkart_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: edkart_user
      SPRING_DATASOURCE_PASSWORD: edkart_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EDKART_SECURITY_CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edkart-network

  # React + Vite Frontend (Nginx SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edkart-frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - edkart-network

volumes:
  mysql_data:

networks:
  edkart-network:
    driver: bridge
